[project]
name = "my-cv-blog-site"
version = "0.3.1"
dependencies = [
    "django>=5.2.15",
    "django-axes>=8.3.1",
    "ruff>=0.15.20",
    "django-otp>=1.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "__pycache__", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--tb=short", "-ra"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.testing"
