<p class="text-muted small mb-2">
    <i class="bi bi-calendar3"></i> {{ post.publish|date:"j E Y" }}
    {% if post.tags.all %}
        <span class="ms-2"><i class="bi bi-tags"></i>
        {% for tag in post.tags.all %}
            <a href="{% url 'blog:post_list_by_tag' tag.slug %}" class="badge text-bg-light text-decoration-none">{{ tag.name }}</a>
        {% endfor %}
        </span>
    {% endif %}
</p>
