{% if page.paginator.num_pages > 1 %}
<nav aria-label="Strony bloga">
    <ul class="pagination">
        {% if page.has_previous %}
            <li class="page-item"><a class="page-link" href="?page={{ page.previous_page_number }}">&laquo; Poprzednia</a></li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">Strona {{ page.number }} z {{ page.paginator.num_pages }}</span></li>
        {% if page.has_next %}
            <li class="page-item"><a class="page-link" href="?page={{ page.next_page_number }}">Następna &raquo;</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
