global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # dodaj adres Alertmanagera gdy potrzebne

scrape_configs:
  - job_name: django
    scrape_interval: 15s
    static_configs:
      - targets: ['web:9100']
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
