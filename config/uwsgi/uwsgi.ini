[uwsgi]
; Aplikacja
module = config.wsgi:application
chdir = /app

; TCP socket — nginx w osobnym kontenerze
socket = :8000
chmod-socket = 666

; Procesy
master = true
processes = 4
threads = 2

; Zachowanie
vacuum = true
die-on-term = true
max-requests = 1000

; Logi do stdout (Docker zbiera stdout)
logto = /dev/stdout
log-date = true