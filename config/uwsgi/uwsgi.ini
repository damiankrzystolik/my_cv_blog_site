[uwsgi]
; Aplikacja
module = config.wsgi:application
chdir = /app

; TCP socket — nginx w osobnym kontenerze
socket = :8000
chmod-socket = 666

; Procesy
master = true
; Liczba workerów = liczba portów eksportera metryk (production.py, prometheus.yml)
processes = 4
threads = 2
; Każdy worker ładuje Django sam, po forku. Bez tego aplikacja ładowała się
; w masterze, eksporter metryk działał tylko tam i nie widział requestów
; obsługiwanych przez workery (puste metryki HTTP w Prometheusie).
lazy-apps = true

; Zachowanie
vacuum = true
die-on-term = true
max-requests = 1000

; Logi idą domyślnie na stderr, który zbiera Docker. Bez `logto = /dev/stdout` —
; uWSGI sprawdzał wtedy co sekundę rotację "pliku" logu i zalewał logi
; komunikatem "uwsgi_check_logrotate()/lseek(): Illegal seek".
log-date = true
